<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exact Paste</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
        padding: 20px 22px 24px;
        min-width: 320px;
      }
      h1 {
        font-size: 16px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 14px;
        color: CanvasText;
        opacity: 0.8;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 14px;
        cursor: pointer;
      }
      .toggle input {
        width: auto;
        margin: 0;
        accent-color: CanvasText;
      }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font: inherit;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
        font: 13px/1.45 ui-monospace, Menlo, monospace;
      }
      button {
        margin-top: 12px;
        padding: 7px 12px;
        font: inherit;
        border: 0;
        border-radius: 6px;
        background: CanvasText;
        color: Canvas;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>Exact Paste</h1>
    <label class="toggle">
      <input id="enabled" type="checkbox" checked />
      <span id="enabled-label">On</span>
    </label>
    <p>
      Paste in a Chrome form field. A matching value from what you copied goes in that box. If the
      copy does not match this box, the vault is used. Shift+paste is always a normal paste.
    </p>
    <label for="vault">Vault</label>
    <textarea
      id="vault"
      spellcheck="false"
      placeholder="LinkedIn
https://www.linkedin.com/in/you

Email
you@studio.com"
    ></textarea>
    <label for="key">TypeSafe API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" />
    <button id="save" type="button">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
