name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run package
        env:
          TYPESAFE_API_KEY: release-must-never-include-this-test-key
      - run: python3 -c "import zipfile; z=zipfile.ZipFile('release/exact-paste.zip'); assert all(b'release-must-never-include-this-test-key' not in z.read(n) for n in z.namelist()); assert z.testzip() is None; z.extractall('.local/package')"
      - run: npm run verify
        env:
          EXACT_PASTE_EXTENSION_DIR: .local/package/exact-paste
      - uses: actions/upload-artifact@v4
        with:
          name: exact-paste-extension
          path: release/exact-paste.zip
