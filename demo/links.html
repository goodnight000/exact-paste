<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hour · Show notes</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin:0; height:100%; background:#0f1412; color:#e6ece8; font:15px/1.45 "IBM Plex Sans", sans-serif; }
      .app { display:grid; grid-template-rows:52px 1fr; height:100%; }
      .bar { display:flex; align-items:center; gap:22px; padding:0 22px; background:#171d1a; border-bottom:1px solid #2a332e; }
      .bar strong { font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
      .bar a { color:#8fa196; text-decoration:none; font-size:13px; }
      .spacer { flex:1; }
      .bar em { font-style:normal; color:#8fa196; font-size:13px; }
      .work { display:grid; grid-template-columns:minmax(300px, 46%) 1fr; min-height:0; }
      .blurb { overflow:auto; padding:40px 40px; }
      .blurb h1 { margin:0 0 18px; font:500 28px/1.2 Newsreader, serif; }
      .blurb article { margin:0; font:18px/1.55 Newsreader, serif; white-space:pre-wrap; }
      .notes { overflow:auto; padding:28px 36px; border-left:1px solid #2a332e; background:#141a17; }
      .notes h2 { margin:0 0 22px; font-size:18px; font-weight:500; }
      form { display:grid; gap:14px; max-width:440px; }
      label { display:flex; flex-direction:column; gap:6px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:#8fa196; }
      input { height:40px; padding:0 11px; border:1px solid #3a463f; border-radius:5px; background:#1b221e; color:#e6ece8; font:15px "IBM Plex Sans", sans-serif; }
      .go { margin-top:8px; width:fit-content; height:40px; padding:0 16px; border:0; border-radius:5px; background:#b7c9b0; color:#121612; font:500 14px "IBM Plex Sans", sans-serif; }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <strong>Hour</strong>
        <a href="index.html">Scenes</a>
        <span class="spacer"></span>
        <em id="ep-status"></em>
      </header>
      <div class="work">
        <section class="blurb">
          <h1>Friday guest</h1>
          <article>for the show notes use her site, not github — github is just dumps.

Nia Okonkwo
https://nia.audio
https://github.com/niaokonkwo
https://www.linkedin.com/in/niaokonkwo</article>
        </section>
        <section class="notes">
          <h2>Links</h2>
          <form action="#" onsubmit="return false">
            <label>Guest name <input name="name" type="text" autocomplete="name" /></label>
            <label>Personal website <input name="site" type="url" /></label>
            <label>GitHub <input name="github" type="url" /></label>
            <label>LinkedIn <input name="linkedin" type="url" /></label>
            <button class="go" type="button">Save notes</button>
          </form>
        </section>
      </div>
    </div>
    <script src="status.js"></script>
  </body>
</html>
