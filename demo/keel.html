<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" />
    <style>
      :root { --bg:#1a1a1a; --bar:#222; --paper:#efece4; --ink:#1c1b18; --dim:#5c5850; --line:#333; --field:#2a2a2a; --text:#ececec; --muted:#9a9a9a; --accent:#c4b48a; }
      * { box-sizing: border-box; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.45 "IBM Plex Sans", sans-serif; }
      .app { display:grid; grid-template-rows:52px 1fr; height:100%; }
      .bar { display:flex; align-items:center; gap:22px; padding:0 22px; background:var(--bar); border-bottom:1px solid var(--line); }
      .bar strong { font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
      .bar a { color:var(--muted); text-decoration:none; font-size:13px; }
      .bar input[type=search] { width:200px; padding:7px 10px; border:1px solid #3a3a3a; border-radius:6px; background:#191919; color:var(--text); font:inherit; }
      .spacer { flex:1; }
      .bar em { font-style:normal; color:var(--muted); font-size:13px; }
      .work { display:grid; grid-template-columns:minmax(320px,42%) 1fr; min-height:0; }
      .letter { overflow:auto; padding:36px 40px; background:var(--paper); color:var(--ink); }
      .letter header { margin:0 0 28px; padding:0 0 20px; border-bottom:1px solid #d5d0c6; font-size:13px; color:var(--dim); }
      .letter h1 { margin:10px 0 0; font:500 22px/1.25 Newsreader, serif; color:var(--ink); }
      .letter article { margin:0; font:18px/1.55 Newsreader, serif; white-space:pre-wrap; }
      .ship { overflow:auto; padding:28px 36px; border-left:1px solid var(--line); }
      .ship h2 { margin:0 0 22px; font-size:18px; font-weight:500; }
      form { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 16px; max-width:560px; }
      label { display:flex; flex-direction:column; gap:6px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
      .span2 { grid-column:span 2; } .span3 { grid-column:1/-1; }
      input { height:40px; padding:0 11px; border:1px solid #4a4a4a; border-radius:5px; background:var(--field); color:var(--text); font:15px "IBM Plex Sans", sans-serif; }
      .go { grid-column:1/-1; margin-top:8px; width:fit-content; height:40px; padding:0 16px; border:0; border-radius:5px; background:var(--accent); color:#1a1814; font:500 14px "IBM Plex Sans", sans-serif; }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <strong>Keel</strong>
        <a href="index.html">Scenes</a>
        <input type="search" placeholder="Search shipments" />
        <span class="spacer"></span>
        <em id="ep-status"></em>
      </header>
      <div class="work">
        <section class="letter">
          <header>
            Elena Voss &lt;elena@voss.studio&gt;<br />
            to studio@keel.test · Tue 11:14 AM
            <h1>not the studio address</h1>
          </header>
          <article>hi, please send the two bowls here, not the studio.

Elena Voss
914 N Damen Ave
Chicago, IL 60622
United States
elena@voss.studio
312-555-0198

buzzer 3B. I'm out Thursday.</article>
        </section>
        <section class="ship">
          <h2>Ship to</h2>
          <form action="#" onsubmit="return false">
            <label class="span2">Recipient <input name="name" type="text" autocomplete="name" /></label>
            <label>Phone <input name="phone" type="tel" autocomplete="tel" /></label>
            <label class="span3">Email <input name="email" type="email" autocomplete="email" /></label>
            <label class="span3">Street <input name="street" type="text" autocomplete="street-address" /></label>
            <label class="span2">City <input name="city" type="text" autocomplete="address-level2" /></label>
            <label>State <input name="state" type="text" autocomplete="address-level1" /></label>
            <label>ZIP <input name="zip" type="text" autocomplete="postal-code" /></label>
            <label class="span2">Country <input name="country" type="text" autocomplete="country-name" /></label>
            <button class="go" type="button">Create label</button>
          </form>
        </section>
      </div>
    </div>
    <script src="status.js"></script>
  </body>
</html>
